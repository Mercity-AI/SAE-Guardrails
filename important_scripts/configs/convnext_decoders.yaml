checkpoint: results/tcn_2k_clean/convnext/checkpoint.pt
device: cuda
data:
  cache_dir: cache/sae500_2k_clean_prompt_response
evaluation:
  boundary_tolerances: [5, 10]
  selection_metric: validation_combined_boundary_f1_at_5
decoders:
  raw:
    method: raw
    value: null
  minimum_duration:
    method: minimum_duration
    values: [2, 3, 5, 8]
  hysteresis_02:
    method: hysteresis
    value: 0.2
  transition_penalty:
    method: transition_penalty
    values: [0.5, 1.0, 2.0, 3.0, 5.0, 8.0]
output: results/convnext_decoders/results.json
