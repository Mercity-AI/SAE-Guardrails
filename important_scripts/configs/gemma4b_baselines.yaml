experiment:
  name: gemma4b_baselines
  output_dir: /workspace/local/results/gemma4b_baselines
  seed: 42
  device: cuda
data:
  dataset: /workspace/local/runs/2k_run_5.6/dataset.cleaned.jsonl
  cache_dir: /workspace/local/cache/sae500_2k_gemma4b
  split_file: split_indices.npz
  feature_selection: training_records_only
  input_features: 500
  supervision: prompt_and_response_topic_tokens
  prompt_tokens: supervised
  template_and_neutral_tokens: masked
training:
  epochs: 15
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  checkpoint_metric: validation_macro_f1
evaluation:
  report_partition: test
  boundary_coordinates: original_token_positions
  boundary_tolerances: [5, 10]
models:
  gru_lr3e4:
    architecture: gru
    model: {hidden_width: 256, depth: 3, dropout: 0.1}
  transformer_wide:
    architecture: transformer
    batch_size: 4
    model: {hidden_width: 256, heads: 8, depth: 2, feedforward_width: 512, dropout: 0.1}
  convnext_window505:
    architecture: convnext
    learning_rate: 0.001
    model: {channels: 256, depth: 6, kernel: 9, expansion: 4, dropout: 0.1, layer_scale: 0.01}
