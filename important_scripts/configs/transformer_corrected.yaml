experiment:
  name: corrected_transformers
  output_dir: results/corrected_transformers
  seed: 42
  device: cuda
data:
  cache_dir: cache/sae500_1500_train_selected
  split_file: split_indices.npz
  feature_selection: training_records_only
  input_features: 500
  supervision: response_topic_tokens_only
  prompt_tokens: context_only
  template_and_neutral_tokens: masked
training:
  epochs: 15
  batch_size: 4
  learning_rate: 0.0003
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  checkpoint_metric: validation_macro_f1
evaluation:
  report_partition: test
  boundary_coordinates: original_token_positions
  boundary_tolerances: [5, 10]
models:
  transformer_base:
    architecture: transformer
    model: {hidden_width: 128, heads: 4, depth: 2, feedforward_width: 256, dropout: 0.1}
  transformer_deep:
    architecture: transformer
    model: {hidden_width: 128, heads: 4, depth: 4, feedforward_width: 256, dropout: 0.1}
  transformer_wide:
    architecture: transformer
    model: {hidden_width: 256, heads: 8, depth: 2, feedforward_width: 512, dropout: 0.1}
