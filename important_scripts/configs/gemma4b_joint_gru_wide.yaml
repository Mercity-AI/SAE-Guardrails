experiment:
  name: gemma4b_joint_gru_wide
  output_dir: /workspace/local/results/gemma4b_joint_heads/gru_wide
  seed: 42
  device: cuda
  gpu_resident_cache: true
data:
  dataset: /workspace/local/runs/2k_run_5.6/dataset.cleaned.jsonl
  cache_dir: /workspace/local/cache/sae500_2k_gemma4b
  input_features: 500
  role_ids: role_ids.npy
  supervision: prompt_and_response_topic_tokens
training:
  epochs: 15
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  boundary_loss_weight: 1.0
  boundary_positive_weight: auto
  train_turn_transition: true
  checkpoint_metric: validation_topic_macro_f1
evaluation:
  boundary_threshold: 0.5
  batch_size: 16
  partitions: [prompt, response, combined]
model:
  architecture: joint_gru
  parameters:
    hidden_width: 384
    depth: 3
    dropout: 0.1
