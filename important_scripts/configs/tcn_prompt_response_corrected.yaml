experiment:
  name: corrected_multiscale_prompt_response
  output_dir: results/corrected_multiscale_prompt_response_yaml
  seed: 42
  device: cuda
data:
  cache_dir: cache/sae500_1500_prompt_response_train_selected
  split_file: split_indices.npz
  feature_selection: training_records_only
  input_features: 500
  supervision: tagged_prompt_and_response_topic_tokens
  template_and_neutral_tokens: masked
training:
  epochs: 15
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  checkpoint_metric: validation_macro_f1
evaluation:
  report_partition: test
  boundary_coordinates: original_token_positions
  boundary_tolerances: [5, 10]
models:
  multiscale_prompt_response:
    architecture: multiscale
    model: {channels: 192, depth: 6, kernels: [3, 5, 9], dropout: 0.1}
