experiment:
  name: tcn_2k_ablations
  output_dir: results/tcn_2k_ablations
  seed: 42
  device: cuda
data:
  dataset: runs/2k_run_5.6/dataset.cleaned.jsonl
  cache_dir: cache/sae500_2k_clean_prompt_response
  split_file: split_indices.npz
  feature_selection: training_records_only
  input_features: 500
  supervision: prompt_and_response_topic_tokens
  prompt_tokens: supervised
  template_and_neutral_tokens: masked
training:
  epochs: 15
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  checkpoint_metric: validation_macro_f1
evaluation:
  report_partition: test
  boundary_coordinates: original_token_positions
  boundary_tolerances: [5, 10]
models:
  plain_shallow: {architecture: baseline, model: {channels: 128, depth: 4, kernel: 3, dropout: 0.1}}
  plain_deep: {architecture: baseline, model: {channels: 128, depth: 8, kernel: 3, dropout: 0.1}}
  plain_wide: {architecture: baseline, model: {channels: 256, depth: 6, kernel: 3, dropout: 0.1}}
  plain_lr3e4: {architecture: baseline, learning_rate: 0.0003, model: {channels: 128, depth: 6, kernel: 3, dropout: 0.1}}
  gated_shallow: {architecture: gated, model: {channels: 256, depth: 4, kernel: 3, dropout: 0.1}}
  gated_deep: {architecture: gated, model: {channels: 256, depth: 8, kernel: 3, dropout: 0.1}}
  gated_narrow: {architecture: gated, model: {channels: 128, depth: 6, kernel: 3, dropout: 0.1}}
  gated_wide: {architecture: gated, model: {channels: 384, depth: 6, kernel: 3, dropout: 0.1}}
  gated_lr3e4: {architecture: gated, learning_rate: 0.0003, model: {channels: 256, depth: 6, kernel: 3, dropout: 0.1}}
  multiscale_shallow: {architecture: multiscale, model: {channels: 192, depth: 4, kernels: [3, 5, 9], dropout: 0.1}}
  multiscale_deep: {architecture: multiscale, model: {channels: 192, depth: 8, kernels: [3, 5, 9], dropout: 0.1}}
  multiscale_narrow: {architecture: multiscale, model: {channels: 96, depth: 6, kernels: [3, 5, 9], dropout: 0.1}}
  multiscale_wide: {architecture: multiscale, model: {channels: 288, depth: 6, kernels: [3, 5, 9], dropout: 0.1}}
  multiscale_lr3e4: {architecture: multiscale, learning_rate: 0.0003, model: {channels: 192, depth: 6, kernels: [3, 5, 9], dropout: 0.1}}
  convnext_shallow: {architecture: convnext, model: {channels: 256, depth: 4, kernel: 7, expansion: 4, dropout: 0.1, layer_scale: 0.01}}
  convnext_deep: {architecture: convnext, model: {channels: 256, depth: 8, kernel: 7, expansion: 4, dropout: 0.1, layer_scale: 0.01}}
  convnext_narrow: {architecture: convnext, model: {channels: 128, depth: 6, kernel: 7, expansion: 4, dropout: 0.1, layer_scale: 0.01}}
  convnext_wide: {architecture: convnext, model: {channels: 384, depth: 6, kernel: 7, expansion: 4, dropout: 0.1, layer_scale: 0.01}}
