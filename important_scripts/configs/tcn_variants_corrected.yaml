experiment:
  name: corrected_tcn_variants
  output_dir: results/corrected_tcn_variants_yaml
  seed: 42
  device: cuda
data:
  cache_dir: cache/sae500_1500_train_selected
  split_file: split_indices.npz
  feature_selection: training_records_only
  input_features: 500
  supervision: response_topic_tokens_only
  prompt_tokens: context_only
  template_and_neutral_tokens: masked
training:
  epochs: 15
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  checkpoint_metric: validation_macro_f1
evaluation:
  report_partition: test
  boundary_coordinates: original_token_positions
  boundary_tolerances: [5, 10]
models:
  gated_base:
    architecture: gated
    model: {channels: 256, depth: 6, kernel: 3, dropout: 0.1}
  multiscale_base:
    architecture: multiscale
    model: {channels: 192, depth: 6, kernels: [3, 5, 9], dropout: 0.1}
  convnext_base:
    architecture: convnext
    model: {channels: 256, depth: 6, kernel: 7, expansion: 4, dropout: 0.1, layer_scale: 0.01}
