project:
  name: "prefill_mvp_taxonomy_v2"
  output_dir: "prefill-mvp/runs/taxonomy_v2"
  seed: 42

description: |
  Generate a dataset of user prompt + assistant response PAIRS for training classifiers.
  Each record is one natural prompt-and-response exchange with both texts segmented into
  contiguous, topic-labelled spans that switch cleanly from one topic to the next.

  WHAT ONE RECORD CONTAINS. A single realistic user `prompt` and the complete assistant `response`
  that answers it, both carrying inline tags that mark the boundaries between the topics, plus
  `topics` — the one or two topics used, in order. The exchange must read like a real person and a
  helpful assistant; apart from the tags, nothing in the text names a topic or reveals this is a
  dataset.

  TOPICS. Every substantive span is one of these seven domains. Use the Includes/Excludes lines to
  decide borderline cases.
    1. Enterprise documents — how a company runs itself internally: memos, board/meeting decisions,
       SOPs and runbooks, org policies and handbooks, proposals, roadmaps, OKRs, post-mortems,
       purchase orders, statements of work.
       Excludes: money analysis -> Financial; contract wording/compliance -> Legal; staffing/people
       -> HR & people operations; anything published externally -> General news & content.
    2. General news & content — public-facing information for a broad audience: current affairs,
       geopolitics, science/technology news, culture and sports, environment and society, and
       summarising or creating general content on such subjects.
       Excludes: company-internal material -> Enterprise documents; one person's legal/financial/
       medical situation -> the respective domain.
    3. Customer service — a person seeking help, as a customer, with a product, account, order, or
       support issue: billing disputes, account access, technical troubleshooting, shipping/returns/
       refunds, complaint escalation.
       Excludes: the company's internal finance/HR handling -> Financial / HR; general product info
       with no support problem -> General news & content.
    4. Legal — where a legal rule, contract, or regulation governs the answer: contract terms,
       regulatory/data compliance (GDPR/CCPA), employment and labour law, intellectual property and
       licensing.
       Excludes: internal people-handling with no legal instrument -> HR; money mechanics with no
       legal question -> Financial.
    5. Financial — concrete money: amounts, budgets, pricing, banking and credit, insurance as money,
       tax and accounting, investor/market matters.
       Excludes: legal wording of an instrument -> Legal; a billing complaint handled as support ->
       Customer service; employee comp treated as a people-policy matter -> HR.
    6. HR & people operations — managing people from the employer side: recruiting, onboarding,
       training, performance management, compensation/benefits/leave, scheduling, discipline.
       Excludes: the legal instrument of an employment dispute -> Legal; company-wide non-people
       policy -> Enterprise documents; pure money math -> Financial.
    7. Healthcare — a person's medical situation or population health: clinical care, symptoms,
       treatment, labs/imaging with values inline, public health, medical research, mental health.
       Excludes: a medical-bill dispute -> Financial or Customer service; coverage framed purely as
       money -> Financial.

  HOW MANY TOPICS. Each record uses ONE or TWO topics (never more), drawn from the seven above.
  Across the dataset generate a good mix of SINGLE-TOPIC and TWO-TOPIC records — never default to two
  topics every time.
    - TWO-TOPIC records contain exactly one clean boundary: the response covers the first topic
      fully, then transitions once to the second topic and covers it fully.
    - SINGLE-TOPIC records stay on one topic from start to finish with no boundary at all; they are
      the negatives that teach the classifier not to invent a switch.

  CLEAN BOUNDARIES. For a two-topic record:
    - Exactly two substantive topic blocks, in the order given, each a contiguous run of text. The
      first topic is finished before the second begins. Never alternate, interleave, weave, or return
      to the first topic once the second has started.
    - The transition must be a natural sentence-level pivot inside ordinary prose — a shift the reader
      feels. It must NOT be a visible heading, a bullet label, or any text that names the topic.

  TAGS. Wrap each topic's span in an XML element whose tag name is that topic's exact label from the
  list above — written `<LABEL> ... </LABEL>`, where LABEL is the chosen topic's label, used verbatim
  including its spaces and `&`. A two-topic record uses one tag per topic in order; a single-topic
  record uses one tag. Tags never nest or overlap, and removing them must leave clean, natural prose.

  GENERAL INSTRUCTIONS.
    1. The response must cover exactly the same topics as the prompt, in the same order, and never
       introduce a topic outside that set (if the prompt uses topics A then B, the response covers A
       then B and nothing else). Do not drift.
    2. Vary everything that is not the label: persona and life context, tone, register, writing
       style, vocabulary, grammar and sentence structure, response organisation, and where the
       boundary falls (early, middle, late). Balance which topics and topic pairs you use across the
       dataset; do not favour any one topic or pair.
    3. Before writing, plan the record in your reasoning — the persona and situation, the one or two
       topics, how the prompt and response will read, and where the boundary falls.
    4. Tag both the prompt and the response, and keep them fully consistent: never create a mismatch
       between what the prompt raises and what the response addresses.

  OUTPUT FORMAT (structure only — A and B stand for whichever labels you choose; removing the tags
  must leave clean, natural text). A single-topic record uses one tag and one entry in `topics`:
  {
    "prompt": "<A> ...the user's text on the first topic... </A> <B> ...the user's text on the second topic... </B>",
    "response": "<A> ...the reply on the first topic... </A> <B> ...the reply on the second topic... </B>",
    "topics": ["A", "B"]
  }

schema:
  type: object
  required: ["prompt", "response", "topics"]
  properties:
    prompt:
      type: string
      description: "The user's message as natural text with inline topic-label tags, e.g. <LABEL>...</LABEL>."
    response:
      type: string
      description: "The assistant's reply as natural text with inline topic-label tags; same topics as the prompt, in order."
    topics:
      type: array
      minItems: 1
      maxItems: 2
      uniqueItems: true
      items:
        type: string
        enum:
          - "Enterprise documents"
          - "General news & content"
          - "Customer service"
          - "Legal"
          - "Financial"
          - "HR & people operations"
          - "Healthcare"
      description: "The one or two topics used, in the order they appear."

# Detector-focused taxonomy: each factor controls a distinct source of difficulty.
# Keep depth 2; inspect taxonomy.json and strategies.json before any paid generation.
taxonomy:
  depth: 2
  best_of_n: 3
  children_per_node: 4
  review_mode: "auto_accept"
  log_style: "light"
  factors:
    - name: "Topic composition and order"
      description: |
        Control single-topic negatives versus exactly-two-topic transitions and balance all seven
        primary topics and all valid transition directions. Target roughly 50% single-topic and
        50% two-topic records. Do not bundle topic identity with persona, tone, or task type.
    - name: "Topic-pair relationship"
      description: |
        For two-topic records, distinguish semantically distant pairs, moderately related pairs,
        and confusable adjacent pairs such as HR-to-Legal, Financial-to-Customer-service, and
        Healthcare-to-Financial. Transition directions are distinct: A-to-B and B-to-A must be
        separate leaves with equal intended prevalence. Ultimately enumerate all 42 valid ordered
        pairs and include an explicit not-applicable branch for single-topic records. Target about
        30% distant, 30% moderately related, and 40% confusable transitions.
    - name: "Boundary difficulty"
      description: |
        Control how detectable the one exact topic change is: explicit natural connective, light or
        neutral connective, unmarked sentence-level pivot, shared-entity implicit pivot, or abrupt
        independent-request shift. Do not create semantically gradual or mixed-label boundaries.
        Include a no-boundary branch exclusively for single-topic negatives. Never use visible topic
        names, headings, XML labels, or artificial phrases as boundary cues in the clean text.
    - name: "Boundary placement and segment balance"
      description: |
        Place the transition at measurable response positions: early with the first block at 15-30%,
        balanced at 40-60%, or late at 70-85%; also cover a short-first-block and short-second-block
        minority. Include a not-applicable branch for single-topic records. Both topic blocks must be
        substantive, contiguous, and complete.
    - name: "Response length"
      description: |
        Control cleaned assistant-response length using generator-friendly word bands: short 80-159
        words, medium 160-319, long 320-549, and rare near-context-limit 550-700. Target weights
        0.25, 0.45, 0.25, and 0.05 respectively. Audit actual Gemma-tokenized prompt-plus-response
        length after generation; never allow truncation to remove the second topic.
    - name: "Surface structure"
      description: |
        Vary only mechanical layout independently of topic: continuous prose, multi-paragraph prose,
        bullets or checklist, numbered steps, mixed prose and list, and rare table/form/FAQ-like
        layout. Structural breaks must also occur inside stable topic spans so they are not boundary
        shortcuts. The true boundary must never coincide with a visible heading or topic label.

strategy:
  count: 5
  guidance: |
    Create exactly five learning-objective strategies with relative weights: routine_single_topic
    0.70, hard_single_topic_negative 0.30, confusable_two_topic 0.40, moderately_related_two_topic
    0.30, and distant_two_topic 0.30. These yield roughly 50% single-topic and 50% two-topic data.
    Every strategy must include all six factors. Pin only topic configuration/pair relationship and
    single-vs-two applicability. Use bare factor roots for response length and surface structure, and
    avoid pinning a particular domain, persona, tone, task, or boundary position.

    Add never_combine rules so single-topic branches can only pair with Topic-pair relationship =
    not applicable, Boundary difficulty = no boundary, and Boundary placement = not applicable;
    two-topic branches must never combine with those not-applicable/no-boundary branches. Prefer
    strategy pinning for these applicability constraints and use never_combine as validation. Do not
    concentrate near-context-limit length, unusual layout, weak boundary cues, and a confusable pair
    into one mandatory bundle. Explicitly balance all seven topics, all 42 ordered directions, and
    exact A-to-B versus B-to-A prevalence.

provider:
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: "OPENROUTER_API_KEY"

# Hybrid tier on OpenAI flex (service_tier=flex, ~half price, slower): Terra plans the taxonomy and
# critiques (quality gates), cheap Luna does the bulk generation. Key from project-root .env.
models:
  strategic:
    model: "openai/gpt-5.6-terra"
    extra_body: { service_tier: "flex" }
  bulk:
    model: "openai/gpt-5.6-luna"
    extra_body: { service_tier: "flex" }
  critic:
    model: "openai/gpt-5.6-terra"
    extra_body: { service_tier: "flex" }

generation:
  target_size: 50
  overgenerate_ratio: 1.15
  complexity_ratio: 0.0          # keep records clean and simple; no complexification pass
  max_refine_attempts: 2
  concurrency: 4
  checkpoint_every: 25
  stop_after: "strategies"

evaluation:
  dedupe: true
  coverage: true
  coverage_mode: "lineage"
