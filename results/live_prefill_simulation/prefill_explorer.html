<title>Live Prefill Demo</title>
<style>
  /* Single light theme — mirrors the matplotlib demo. Excalidraw / Open Color palette. */
  :root {
    --page:   #ffffff;
    --card:   #ffffff;
    --track:  #f1f3f5;   /* open-color gray-1 */
    --ink:    #1e1e1e;   /* Excalidraw stroke */
    --ink-2:  #495057;   /* gray-7 */
    --muted:  #868e96;   /* gray-6 */
    --line:   #e9ecef;   /* gray-2 */
    --line-2: #f1f3f5;
    --grid:   #eceef1;
    --accent: #1971c2;   /* Excalidraw blue */
    --future: #ced4da;   /* gray-3 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); }
  .app {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink); background: var(--page);
    min-height: 100vh; padding: 22px clamp(16px, 3vw, 40px) 30px;
    max-width: 1500px; margin: 0 auto;
  }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }
  .tnum { font-variant-numeric: tabular-nums; }

  h1 { text-align: center; font-size: clamp(20px, 2.4vw, 27px); font-weight: 750;
       letter-spacing: -.01em; margin: 2px 0 18px; text-wrap: balance; }

  /* ---------- toolbar ---------- */
  .toolbar { display: flex; align-items: center; justify-content: space-between;
    gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .tool-left { display: flex; align-items: center; gap: 12px; }
  .btn { font: inherit; font-size: 13.5px; font-weight: 550; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    transition: border-color .12s, background .12s, box-shadow .12s, transform .04s; }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.icon { padding: 0; width: 40px; height: 40px; justify-content: center; font-size: 15px; border-radius: 11px; }
  .btn.play { width: 52px; height: 52px; border-radius: 50%; font-size: 19px;
    background: var(--accent); color: #fff; border-color: transparent;
    box-shadow: 0 4px 14px rgba(25,113,194,.32); }
  .btn.play:hover { filter: brightness(1.05); border-color: transparent; }
  .fname { font-size: 13px; color: var(--ink-2); background: var(--track);
    border-radius: 8px; padding: 6px 11px; max-width: 42vw; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; }
  #file { display: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { font: inherit; font-size: 12.5px; font-weight: 550; color: var(--ink-2);
    background: var(--card); border: 0; border-left: 1px solid var(--line); padding: 8px 11px; cursor: pointer; }
  .seg button:first-child { border-left: 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  .seg .lbl { align-self: center; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); padding: 0 10px; }

  /* ---------- figure ---------- */
  .figure { display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; align-items: stretch; }
  @media (max-width: 920px) { .figure { grid-template-columns: 1fr; } }

  .card { position: relative; background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: 0 1px 2px rgba(30,30,30,.04), 0 10px 30px rgba(30,30,30,.05); }
  .meta { position: absolute; top: 16px; left: 18px; z-index: 2; }
  .meta .m1 { font-size: 12.5px; font-weight: 700; color: var(--ink); }
  .meta .m2 { font-size: 12px; color: var(--muted); margin-top: 3px; }
  #stream { text-align: center; padding: 74px 26px 26px; line-height: 2.05;
    font-size: 17px; min-height: 360px; max-height: 460px; overflow-y: auto; }
  @media (max-width: 920px) { #stream { min-height: 240px; } }
  .tok { border-radius: 5px; padding: 2px 1px; transition: background-color .16s, color .16s, box-shadow .16s; }
  .tok.future { color: var(--future); }
  .tok.cur { box-shadow: 0 0 0 2.2px var(--o); font-weight: 700; }

  /* right panel — vertical bars */
  .dist { display: flex; flex-direction: column; padding: 18px 20px 16px; }
  .cap { text-align: center; font-size: 15px; font-weight: 700; min-height: 22px; margin-bottom: 14px; }
  .cap .q { color: var(--muted); font-weight: 600; }
  .plot { position: relative; height: 306px; margin-left: 46px; }
  .ptopic { font-size: 12px; color: var(--ink-2); margin: 0 0 4px 46px; }
  .gridline { position: absolute; left: 0; right: 0; border-top: 1px solid var(--grid); }
  .ytick { position: absolute; left: -40px; transform: translateY(-50%); width: 32px; text-align: right;
    font-size: 11.5px; color: var(--muted); }
  .cols { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2%; }
  .vcol { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .vval { font-size: 12px; margin-bottom: 4px; color: var(--muted); white-space: nowrap; }
  .vcol.top .vval { color: var(--ink); font-weight: 700; }
  .vbar { width: 74%; border-radius: 5px 5px 0 0; height: 0; transition: height .16s ease, background-color .16s; }
  .xlabels { display: flex; gap: 2%; margin: 8px 0 0 46px; }
  .xlab { flex: 1; text-align: center; font-size: 11px; line-height: 1.25; color: var(--ink-2); }

  /* ---------- transport ---------- */
  .transport { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center;
    margin: 20px auto 0; padding: 12px 18px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; max-width: 760px; box-shadow: 0 1px 2px rgba(30,30,30,.04); }
  .tgrp { display: flex; align-items: center; gap: 8px; }
  #scrub { flex: 1 1 220px; min-width: 160px; accent-color: var(--accent); height: 4px; cursor: pointer; }
  .step { font-size: 13px; color: var(--ink-2); min-width: 92px; text-align: center; }
  .step b { color: var(--ink); }

  /* ---------- legend + note ---------- */
  .legend { display: flex; flex-wrap: wrap; gap: 9px 20px; justify-content: center; align-items: center;
    margin: 22px auto 6px; max-width: 1100px; }
  .lg { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .sw { width: 15px; height: 15px; border-radius: 4px; flex: none; }
  .note { text-align: right; font-size: 12px; font-style: italic; color: var(--muted); margin-top: 8px; }
  #msg { text-align: center; font-size: 13px; color: #c92a2a; min-height: 18px; margin-top: 8px; }

  @media (prefers-reduced-motion: reduce) { .tok, .vbar { transition: none; } }
</style>

<div class="app" id="app">
  <h1>Live Prefill Demo — one token at a time</h1>

  <div class="toolbar">
    <div class="tool-left">
      <button class="btn" id="load">⬆ Load JSON</button>
      <span class="fname" id="fname">strong_577.json</span>
      <input type="file" id="file" accept=".json,application/json" multiple>
    </div>
    <div class="seg" role="group" aria-label="Speed">
      <span class="lbl">speed</span>
      <button data-spd="0.5">0.5×</button>
      <button data-spd="1" class="on">1×</button>
      <button data-spd="2">2×</button>
      <button data-spd="4">4×</button>
    </div>
  </div>

  <div class="figure">
    <section class="card" aria-label="Response token stream">
      <div class="meta">
        <div class="m1">Model: Gemma 3 1B IT</div>
        <div class="m2" id="stepMeta">Step 1 / 1</div>
      </div>
      <div id="stream"></div>
    </section>

    <section class="card dist" aria-label="Current-token topic distribution">
      <div class="cap" id="cap"></div>
      <div class="ptopic">P(topic)</div>
      <div class="plot" id="plot"></div>
      <div class="xlabels" id="xlabels"></div>
    </section>
  </div>

  <div class="transport" role="group" aria-label="Playback">
    <div class="tgrp">
      <button class="btn icon" id="restart" title="Restart">⟲</button>
      <button class="btn icon" id="back" title="Step back">◀</button>
      <button class="btn play" id="play" title="Play / pause">▶</button>
      <button class="btn icon" id="fwd" title="Step forward">▶</button>
    </div>
    <input type="range" id="scrub" min="0" max="0" value="0">
    <div class="step mono tnum" id="step">–</div>
  </div>

  <div class="legend" id="legend"></div>
  <div class="note">★ Text shading indicates model confidence</div>
  <div id="msg" role="status"></div>
</div>

<script>
(() => {
  "use strict";

  // Excalidraw / Open Color (shade-8) — same mapping as the matplotlib demo.
  const TOPIC_HEX = {
    "Enterprise documents":   "#1971c2",
    "General news & content": "#e8590c",
    "Customer service":       "#0c8599",
    "Legal":                  "#f08c00",
    "Financial":              "#9c36b5",
    "HR & people operations": "#2f9e44",
    "Healthcare":             "#c2255c",
  };
  const FALLBACK = ["#1971c2","#e8590c","#0c8599","#f08c00","#9c36b5","#2f9e44","#c2255c"];
  // two-line short labels for the x-axis
  const SHORT = {
    "Enterprise documents": "Enterprise<br>docs",
    "General news & content": "General<br>news",
    "Customer service": "Customer<br>service",
    "HR & people operations": "HR &<br>people ops",
  };

  const $ = id => document.getElementById(id);
  const streamEl = $("stream"), plotEl = $("plot"), xlabelsEl = $("xlabels"),
        capEl = $("cap"), legendEl = $("legend"), scrub = $("scrub"),
        stepEl = $("step"), stepMeta = $("stepMeta"), msg = $("msg"), fnameEl = $("fname");

  const TEXT_SHADE = 0.8;   // token-highlight opacity (user: -20%); text only, not bars
  let toks = [], labels = [], fbIndex = {};
  let step = 0, playing = false, timer = null, speed = 1;
  let tokSpans = [], cols = [];

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const hexRgb = h => { h = h.replace("#",""); return [0,2,4].map(i => parseInt(h.slice(i,i+2),16)); };
  // tint toward white; r = how much hue shows through (matches make_demo.tint)
  const tint = (hex, r) => { const c = hexRgb(hex); return `rgb(${c.map(v => Math.round(255*(1-r)+v*r)).join(",")})`; };
  const darken = (hex, r) => { const c = hexRgb(hex); return `rgb(${c.map(v => Math.round(v*(1-r))).join(",")})`; };
  const hue = t => TOPIC_HEX[t] || FALLBACK[(fbIndex[t] ?? 0) % FALLBACK.length];
  const shortLabel = l => SHORT[l] || esc(l);
  const disp = t => t === "\n" ? "↵" : ({ "<bos>":"⟨bos⟩","<end_of_turn>":"⟨end⟩","<start_of_turn>":"⟨start⟩" }[t] ?? t);

  function setSample(data, name) {
    toks = data.tokens || [];
    labels = toks.length ? Object.keys(toks[0].probabilities) : [];
    fbIndex = {}; let fi = 0; labels.forEach(l => { if (!TOPIC_HEX[l]) fbIndex[l] = fi++; });
    if (name) fnameEl.textContent = name;
    step = 0; pause();
    scrub.max = String(Math.max(0, toks.length - 1)); scrub.value = "0";
    buildStream(); buildPlot(); buildLegend(); render();
  }

  function buildStream() {
    streamEl.textContent = "";
    tokSpans = [];
    toks.forEach((t, j) => {
      const s = document.createElement("span");
      s.className = "tok"; s.textContent = disp(t.text);
      s.title = `#${t.position} · ${t.role}`;
      s.addEventListener("click", () => { pause(); setStep(j); });
      streamEl.appendChild(s);
      tokSpans.push(s);
      if (t.text.includes("\n")) streamEl.appendChild(document.createElement("br"));
    });
  }

  const YMAX = 1.14;   // headroom above a full bar for its % label (matches make_demo)
  function buildPlot() {
    // gridlines + y ticks at 0,.25,.5,.75,1  (bottom = 0)
    plotEl.querySelectorAll(".gridline,.ytick,.cols").forEach(n => n.remove());
    [0, .25, .5, .75, 1].forEach(v => {
      const pos = (v / YMAX * 100) + "%";
      const g = document.createElement("div"); g.className = "gridline"; g.style.bottom = pos;
      const y = document.createElement("div"); y.className = "ytick mono tnum";
      y.style.bottom = pos; y.textContent = v.toFixed(2);
      plotEl.append(g, y);
    });
    const colsWrap = document.createElement("div"); colsWrap.className = "cols";
    cols = labels.map(l => {
      const col = document.createElement("div"); col.className = "vcol";
      col.innerHTML = `<div class="vval mono tnum">0%</div><div class="vbar"></div>`;
      colsWrap.appendChild(col);
      return { col, val: col.querySelector(".vval"), bar: col.querySelector(".vbar") };
    });
    plotEl.appendChild(colsWrap);
    xlabelsEl.innerHTML = labels.map(l => `<div class="xlab">${shortLabel(l)}</div>`).join("");
  }

  function buildLegend() {
    const present = [];
    toks.forEach(t => { if (!present.includes(t.prediction)) present.push(t.prediction); });
    legendEl.innerHTML = present.map(l =>
      `<span class="lg"><span class="sw" style="background:${hue(l)}"></span>${esc(l)}</span>`).join("");
  }

  function render() {
    if (!toks.length) return;
    const t = toks[step], top = t.prediction;
    for (let j = 0; j < toks.length; j++) {
      const span = tokSpans[j], tk = toks[j];
      span.classList.remove("future", "cur");
      span.style.background = ""; span.style.color = ""; span.style.removeProperty("--o");
      if (j < step) {
        span.style.background = tint(hue(tk.prediction), (0.14 + 0.58 * tk.confidence) * TEXT_SHADE);
        span.style.color = "var(--ink)";
      } else if (j === step) {
        span.classList.add("cur");
        span.style.background = tint(hue(tk.prediction), 0.42 * TEXT_SHADE);
        span.style.color = "var(--ink)";
        span.style.setProperty("--o", hue(tk.prediction));
      } else span.classList.add("future");
    }
    const c = tokSpans[step];
    if (c) { const r = c.offsetTop;
      if (r < streamEl.scrollTop || r > streamEl.scrollTop + streamEl.clientHeight - 44)
        streamEl.scrollTo({ top: Math.max(0, r - streamEl.clientHeight/2), behavior: "smooth" }); }

    labels.forEach((l, i) => {
      const b = cols[i], p = t.probabilities[l], isTop = l === top;
      b.col.classList.toggle("top", isTop);
      b.bar.style.height = (p / YMAX * 100).toFixed(2) + "%";
      b.bar.style.background = isTop ? hue(l) : tint(hue(l), 0.42);
      b.val.textContent = (p * 100 < 0.5 ? "" : (p*100).toFixed(p >= 0.1 ? 0 : 1) + "%");
    });

    const shown = (t.text || "").trim() || (t.text === "\n" ? "↵" : "␣");
    capEl.innerHTML = `<span class="q">current token</span> “${esc(shown)}” &nbsp;→&nbsp; ` +
                      `<span style="color:${darken(hue(top), 0.32)}">${esc(top)}</span>`;
    scrub.value = String(step);
    stepEl.innerHTML = `<b>${step+1}</b> / ${toks.length}`;
    stepMeta.textContent = `Step ${step+1} / ${toks.length}`;
  }

  // transport
  function setStep(i) { step = Math.max(0, Math.min(toks.length - 1, i)); render(); }
  function tick() { if (step >= toks.length - 1) { pause(); return; } setStep(step + 1); }
  function play() { if (step >= toks.length - 1) step = 0; playing = true; $("play").textContent = "❚❚";
    timer = setInterval(tick, 460 / speed); }
  function pause() { playing = false; $("play").textContent = "▶"; if (timer) clearInterval(timer); timer = null; }

  $("play").onclick = () => playing ? pause() : play();
  $("fwd").onclick = () => { pause(); setStep(step + 1); };
  $("back").onclick = () => { pause(); setStep(step - 1); };
  $("restart").onclick = () => { pause(); setStep(0); };
  scrub.oninput = () => { pause(); setStep(parseInt(scrub.value, 10)); };
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
    document.querySelectorAll(".seg button").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); speed = parseFloat(b.dataset.spd); if (playing) { pause(); play(); }
  });
  document.addEventListener("keydown", e => {
    if (["INPUT","BUTTON","SELECT"].includes(e.target.tagName)) return;
    if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
    else if (e.code === "ArrowRight") { pause(); setStep(step + 1); }
    else if (e.code === "ArrowLeft") { pause(); setStep(step - 1); }
  });

  // file loading
  async function handleFiles(list) {
    const files = [...list].filter(f => /\.json$/i.test(f.name) || f.type.includes("json"));
    if (!files.length) { msg.textContent = "Please choose a .json sample file."; return; }
    const f = files[0];
    try {
      const data = JSON.parse(await f.text());
      if (data && Array.isArray(data.samples) && !data.tokens)
        throw new Error("That's summary.json — load an individual sample_*.json.");
      if (!Array.isArray(data.tokens) || !data.tokens.length || !data.tokens[0].probabilities)
        throw new Error("Not a sample JSON (need a \"tokens\" array with \"probabilities\").");
      msg.textContent = ""; setSample(data, f.name);
    } catch (err) { msg.textContent = err.message || String(err); }
  }
  $("load").onclick = () => $("file").click();
  $("file").onchange = e => handleFiles(e.target.files);
  ["dragenter","dragover"].forEach(ev => $("app").addEventListener(ev, e => e.preventDefault()));
  $("app").addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer?.files) handleFiles(e.dataTransfer.files); });

  // boot with built-in sample
  try {
    const b = JSON.parse($("builtin").textContent);
    setSample(b, `${b.selection}_${b.dataset_index}.json`);
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const i = toks.findIndex(t => t.role === "response"); setStep(i < 0 ? 0 : i); setTimeout(play, 650);
    }
  } catch (e) { msg.textContent = "Load a sample_*.json to begin."; }
})();
</script>
